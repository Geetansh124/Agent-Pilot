services:
  - type: web
    name: agent-pilot-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: STORAGE_BACKEND
        value: google_drive
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_DYNAMODB_TABLE
        value: agent-pilot-documents
      - key: FRONTEND_ORIGIN
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "false"
