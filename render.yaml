services:
  - type: web
    name: docupilot-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_S3_BUCKET
        value: docupilot-327514289233-us-east-1
      - key: AWS_DYNAMODB_TABLE
        value: docupilot-documents
      - key: FRONTEND_ORIGIN
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "false"
